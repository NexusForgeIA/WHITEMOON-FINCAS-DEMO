<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión · Whitemoon Fincas</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="crm">

<!-- ================================================================ ACCESO -->
<!-- Una clave, sin usuario. La comprobación NO está aquí: este formulario
     sólo manda la clave a la Edge Function fincas-panel-auth, que la valida
     contra un Secret (o su hash) y devuelve una sesión real de Supabase. Un
     candado de JavaScript no serviría de nada: detrás hay IBAN y datos de
     propietarios, y cualquiera puede abrir las herramientas del navegador. -->
<div class="login-velo" id="login">
  <div class="login-caja">
    <div class="marca">
      <span class="luna" aria-hidden="true"></span>
      <span class="marca-txt">
        <b>Whitemoon Fincas</b>
        <span>Gestión interna</span>
      </span>
    </div>
    <h1>Acceso al panel</h1>
    <p>Introduce la clave de acceso del equipo.</p>

    <form id="form-clave" autocomplete="off">
      <div class="campo">
        <label for="clave">Clave de acceso</label>
        <input id="clave" type="password" required autocomplete="one-time-code"
               placeholder="••••••••••••" autofocus>
      </div>
      <p class="login-error" id="login-error" hidden></p>
      <button class="btn btn-p" type="submit" id="clave-btn" style="justify-content:center">Entrar</button>
    </form>

    <!-- Vía alternativa para el equipo, no anunciada en ningún sitio. -->
    <p style="margin-top:22px;font-size:12px;color:var(--muted)">
      <a href="#" id="ver-email">Entrar con email y contraseña</a>
    </p>

    <form id="form-login" autocomplete="on" hidden style="margin-top:6px">
      <div class="campo">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" autocomplete="username">
      </div>
      <div class="campo">
        <label for="login-pass">Contraseña</label>
        <input id="login-pass" type="password" autocomplete="current-password">
      </div>
      <button class="btn btn-linea" type="submit" id="login-btn" style="justify-content:center">Entrar</button>
    </form>
  </div>
</div>

<!-- ================================================================ SHELL -->
<div class="crm-shell" id="shell" hidden>

  <aside class="lateral">
    <div class="marca">
      <span class="luna" aria-hidden="true"></span>
      <span class="marca-txt">
        <b>Whitemoon Fincas</b>
        <span>Gestión interna</span>
      </span>
    </div>

    <nav id="nav">
      <button class="nav-btn activo" data-seccion="expedientes">
        Expedientes <span class="cuenta" id="c-expedientes">0</span>
      </button>
      <button class="nav-btn" data-seccion="presupuestos">
        Presupuestos <span class="cuenta" id="c-presupuestos">0</span>
      </button>
      <button class="nav-btn" data-seccion="contable">
        Contable IA <span class="cuenta" id="c-contable">0</span>
      </button>
      <button class="nav-btn" data-seccion="correos">
        Correos <span class="cuenta" id="c-correos">0</span>
      </button>
      <button class="nav-btn" data-seccion="facturacion">
        Facturación <span class="cuenta" id="c-facturacion">0</span>
      </button>
      <button class="nav-btn" data-seccion="comunidades">
        Comunidades <span class="cuenta" id="c-comunidades">0</span>
      </button>
      <button class="nav-btn" data-seccion="proveedores">
        Proveedores <span class="cuenta" id="c-proveedores">0</span>
      </button>
      <button class="nav-btn" data-seccion="plantillas">Plantillas</button>
      <button class="nav-btn" data-seccion="autonomia">Autonomía</button>
      <button class="nav-btn" data-seccion="auditoria">Auditoría</button>
    </nav>

    <div class="lateral-pie">
      <p id="quien"></p>
      <button class="btn-mini" id="salir">Cerrar sesión</button>
    </div>
  </aside>

  <main class="panel" id="panel"></main>
</div>

<!-- Modal genérico: ficha de expediente y editores. -->
<div class="velo" id="velo" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-tit">
    <button class="cerrar" id="cerrar-modal" aria-label="Cerrar">×</button>
    <div id="modal-cuerpo"></div>
  </div>
</div>

<!-- pdf.js NO se carga aquí: admin.js lo importa dinámicamente sólo cuando
     alguien sube una normativa, que es una acción poco frecuente. Cargarlo
     siempre serían cientos de KB para todos los que sólo miran expedientes. -->
<script type="module" src="assets/js/admin.js"></script>
</body>
</html>
